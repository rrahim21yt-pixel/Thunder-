
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>THUNDER LOVE SURVIVAL ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02040a;
    font-family:Arial,"Noto Sans Bengali",sans-serif;
}

body{
    color:white;
}

/* =========================
   GAME
========================= */

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 50%,
            #17334a 0%,
            #07131f 45%,
            #02040a 100%
        );
}

/* NIGHT SKY */

.sky{
    position:absolute;
    inset:0;

    background:
        radial-gradient(
            circle at 30% 20%,
            rgba(100,190,255,.12),
            transparent 25%
        ),
        radial-gradient(
            circle at 75% 30%,
            rgba(160,80,255,.10),
            transparent 30%
        );

    animation:skyPulse 5s infinite alternate;
}

@keyframes skyPulse{
    from{filter:brightness(.7)}
    to{filter:brightness(1.15)}
}

/* CLOUDS */

.cloud{
    position:absolute;

    width:300px;
    height:80px;

    border-radius:100px;

    background:
        linear-gradient(
            180deg,
            rgba(35,45,65,.95),
            rgba(7,12,22,.95)
        );

    filter:blur(2px);

    box-shadow:
        0 20px 45px
        rgba(0,0,0,.6);

    animation:
        cloudMove linear infinite;
}

.cloud:before,
.cloud:after{
    content:"";

    position:absolute;

    border-radius:50%;

    background:
        linear-gradient(
            180deg,
            #29354a,
            #0a111d
        );
}

.cloud:before{
    width:120px;
    height:120px;

    left:55px;
    bottom:10px;
}

.cloud:after{
    width:90px;
    height:90px;

    right:50px;
    bottom:8px;
}

.cloud1{
    top:7%;
    left:-350px;
    animation-duration:34s;
}

.cloud2{
    top:18%;
    left:-500px;
    transform:scale(.75);
    animation-duration:45s;
    animation-delay:-20s;
}

.cloud3{
    top:2%;
    left:-600px;
    transform:scale(.55);
    animation-duration:52s;
    animation-delay:-35s;
}

@keyframes cloudMove{
    to{
        transform:
            translateX(
                calc(100vw + 900px)
            );
    }
}

/* WATER */

.water{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:45%;

    background:
        linear-gradient(
            180deg,
            rgba(5,35,53,.55),
            #020a12
        );

    overflow:hidden;
}

.water:before{
    content:"";

    position:absolute;
    inset:0;

    background:
        repeating-linear-gradient(
            170deg,
            transparent 0px,
            transparent 13px,
            rgba(80,180,220,.10) 14px,
            transparent 16px
        );

    animation:
        waves 2s linear infinite;
}

@keyframes waves{
    to{
        background-position:70px 0;
    }
}

/* GROUND */

.ground{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:28%;

    background:
        linear-gradient(
            180deg,
            rgba(8,25,30,.2),
            rgba(1,7,10,.95)
        );
}

/* =========================
   LIGHTNING
========================= */

#flash{
    position:absolute;
    inset:0;

    background:white;

    opacity:0;

    pointer-events:none;

    z-index:20;
}

.lightningBolt{
    position:absolute;

    width:5px;
    height:220px;

    background:#d9f7ff;

    filter:
        drop-shadow(
            0 0 15px #5edfff
        );

    clip-path:
        polygon(
            50% 0,
            100% 0,
            58% 42%,
            88% 42%,
            25% 100%,
            42% 54%,
            12% 54%
        );

    opacity:0;

    z-index:10;
}

/* =========================
   RAIN
========================= */

#rain{
    position:absolute;
    inset:0;

    pointer-events:none;

    z-index:8;
}

    width:1px;
    height:18px;

    background
